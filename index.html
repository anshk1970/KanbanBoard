<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main>
    <nav>
      <div class="left">
        <span class="logo-dot"></span>
        <h1>Kanban Board</h1>
      </div>
      <div class="right">
        <button id="toggle-modal">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Add Task
        </button>
      </div>
    </nav>

    <section class="board">

      <div id="todo" class="task-column">
        <div class="heading">
          <div class="left">
            <span class="col-dot col-dot--todo"></span>
            To Do
          </div>
          <div class="right count-badge">0</div>
        </div>
        <div class="empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <line x1="9" y1="12" x2="15" y2="12"/>
          </svg>
          <span>Not a task yet</span>
        </div>
      </div>

      <div id="progress" class="task-column">
        <div class="heading">
          <div class="left">
            <span class="col-dot col-dot--progress"></span>
            In Progress
          </div>
          <div class="right count-badge">0</div>
        </div>
        <div class="empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 3"/>
          </svg>
          <span>Not a task yet</span>
        </div>
      </div>

      <div id="done" class="task-column">
        <div class="heading">
          <div class="left">
            <span class="col-dot col-dot--done"></span>
            Done
          </div>
          <div class="right count-badge">0</div>
        </div>
        <div class="empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="9 12 11 14 15 10"/>
          </svg>
          <span>Not a task yet</span>
        </div>
      </div>

    </section>
  </main>

 
  <div class="modal add-new-task" role="dialog" aria-modal="true" aria-label="Add new task">
    <div class="bg"></div>
    <div class="center">
      <div class="modal-header">
        <h2>New Task</h2>
        <button class="modal-close" id="close-modal" aria-label="Close modal">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <label for="task-title-input" class="field-label">Title</label>
      <input id="task-title-input" type="text" placeholder="e.g. Design homepage wireframe" />

      <label for="task-desc-input" class="field-label">Description</label>
      <textarea id="task-desc-input" rows="4" placeholder="What needs to be done?"></textarea>

      <button id="add-new-task" class="add-task-btn">Add Task</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
